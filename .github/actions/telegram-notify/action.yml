name: 'Telegram Notification'
description: 'Send Telegram notification for build status'
inputs:
  status:
    description: 'Status type (start/end)'
    required: true
  result:
    description: 'Build result (success/failure/cancelled)'
    required: false
    default: ''
  duration:
    description: 'Build duration'
    required: false
    default: ''
  artifact_name:
    description: 'Artifact name'
    required: false
    default: ''
  platform:
    description: 'Build platform'
    required: true
  flavor:
    description: 'Build flavor (dev/release)'
    required: true
  bot_token:
    description: 'Telegram Bot Token'
    required: true
    default: ''
  chat_id: 
    description: 'Telegram Chat ID'
    required: true
    default: ''
  chat_thread_id:
    description: 'Telegram Chat Thread ID (for groups)'
    required: true
    default: ''

runs:
  using: composite
  steps:
    - name: Check Telegram secrets
      id: check_telegram
      run: |
        if [ -n "${{ inputs.bot_token }}" ] && [ -n "${{ inputs.chat_id }}" ]; then
          echo "has_telegram=true" >> $GITHUB_OUTPUT
        else
          echo "has_telegram=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Send Telegram notification
      if: steps.check_telegram.outputs.has_telegram == 'true'
      run: |

        escape_markdown() {
          echo "$1" | sed -e 's/\([_[\]()~`>#\+\-=|{}.!]\)/\\\\\1/g'
         }

        PLATFORM=$(escape_markdown "${{ inputs.platform }}")
        FLAVOR=$(escape_markdown "${{ inputs.flavor }}")
        REPO=$(escape_markdown "${{ github.repository }}")
        BRANCH=$(escape_markdown "${{ github.ref_name }}")
        COMMIT=$(escape_markdown "${GITHUB_SHA:0:7}")
        ACTOR=$(escape_markdown "${{ github.actor }}")
        DURATION=$(escape_markdown "${{ inputs.duration }}")
        ARTIFACT=$(escape_markdown "${{ inputs.artifact_name }}")
        SERVER_URL=$(escape_markdown "${{ github.server_url }}")
        RUN_ID=$(escape_markdown "${{ github.run_id }}")

        MESSAGE=""
        if [ "${{ inputs.status }}" = "start" ]; then
          MESSAGE="🚀 *Build Started* 
          \\n*Platform:* $PLATFORM
          \\n*Flavor:* $FLAVOR
          \\n*Repo:* $REPO
          \\n*Branch:* $BRANCH
          \\n*Commit:* $COMMIT
          \\n*By:* $ACTOR
          \n*Run:* [View](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        else
          RESULT_EMOJI=""
          case "${{ inputs.result }}" in
            "success") RESULT_EMOJI="✅" ;;
            "failure") RESULT_EMOJI="❌" ;;
            "cancelled") RESULT_EMOJI="⏹️" ;;
            *) RESULT_EMOJI="ℹ️" ;;
          esac
          
          MESSAGE="${RESULT_EMOJI} *Build $(escape_md "${{ inputs.result }}")*
          \n*Platform:* $(escape_md "${{ inputs.platform }}")
          \n*Flavor:* $(escape_md "${{ inputs.flavor }}")
          \n*Duration:* $(escape_md "${{ inputs.duration }}")
          \n*Artifact:* $(escape_md "${{ inputs.artifact_name }}")
          \n*Run:* [View](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        fi

        JSON_DATA=$(jq -n \
          --arg chat_id "${{ inputs.chat_id }}" \
          --arg message_thread_id "${{ inputs.chat_thread_id }}" \
          --arg text "$MESSAGE" \
          '{
            chat_id: $chat_id,
            message_thread_id: $message_thread_id,
            text: $text,
            parse_mode: "MarkdownV2",  # Telegram's Markdown version 2
            disable_web_page_preview: true  # Disable link previews for cleaner appearance
          }')
          
        echo "$MESSAGE"
        
        curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
          -H "Content-Type: application/json" \  # Set content type header
          -d "$JSON_DATA"  # Send the JSON data as request body
          
      shell: bash