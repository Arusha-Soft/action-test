name: 'Telegram File Upload'
description: 'Upload files to Telegram'
inputs:
  files:
    description: 'File pattern to upload'
    required: true
  caption:
    description: 'File caption'
    required: false
    default: ''
  bot_token:
    description: 'Telegram Bot Token'
    required: true
    default: ''
  chat_id:
    description: 'Telegram Chat ID'
    required: true
    default: ''
  chat_thread_id:
    description: 'Telegram Chat Thread ID (for groups)'
    required: true
    default: ''

runs:
  using: composite
  steps:
    - name: Check Telegram secrets
      id: check_telegram
      run: |
        if [ -n "${{ inputs.bot_token }}" ] && [ -n "${{ inputs.chat_id }}" ]; then
          echo "has_telegram=true" >> $GITHUB_OUTPUT
        else
          echo "has_telegram=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Upload files to Telegram
      if: steps.check_telegram.outputs.has_telegram == 'true'
      run: |
        for file in ${{ inputs.files }}; do
          if [ -f "$file" ]; then
            echo "Uploading $file to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument" \
              -H "Content-Type: multipart/form-data" \
              -F "chat_id=${{ inputs.chat_id }}" \
              -F "message_thread_id=${{ inputs.chat_thread_id }}" \
              -F "document=@$file" \
              -F "caption=${{ inputs.caption }}"
          fi
        done
      shell: bash