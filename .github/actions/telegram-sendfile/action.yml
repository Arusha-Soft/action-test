- name: Send message or files to Telegram
  if: steps.check_telegram.outputs.has_telegram == 'true'
  run: |
    # If no files provided, send message only
    if [ -z "${{ inputs.files }}" ] || [ "${{ inputs.files }}" = "" ]; then
      echo "Sending message only..."
      curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
        -d chat_id="${{ inputs.chat_id }}" \
        -d message_thread_id="${{ inputs.chat_thread_id }}" \
        --data-urlencode text="${{ inputs.caption }}" \
        -d parse_mode="HTML" \
        -d disable_web_page_preview=true
      exit 0
    fi
    
    # Create an array of files
    IFS=' ' read -ra files <<< "${{ inputs.files }}"
    valid_files=()
    
    # Check which files actually exist
    for file in "${files[@]}"; do
      if [ -f "$file" ]; then
        valid_files+=("$file")
        echo "Found valid file: $file"
      else
        echo "File not found: $file"
      fi
    done
    
    if [ ${#valid_files[@]} -eq 0 ]; then
      echo "No valid files found to upload, sending message instead..."
      curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMessage" \
        -d chat_id="${{ inputs.chat_id }}" \
        -d message_thread_id="${{ inputs.chat_thread_id }}" \
        --data-urlencode text="${{ inputs.caption }}" \
        -d parse_mode="HTML" \
        -d disable_web_page_preview=true
      exit 0
    fi
    
    # If only one file, use sendDocument with caption
    if [ ${#valid_files[@]} -eq 1 ]; then
      echo "Uploading single file with caption..."
      curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument" \
        -F "chat_id=${{ inputs.chat_id }}" \
        -F "message_thread_id=${{ inputs.chat_thread_id }}" \
        -F "document=@${valid_files[0]}" \
        -F "caption=${{ inputs.caption }}" \
        -F "parse_mode=HTML"
    
    # If multiple files, use sendMediaGroup with caption on first file
    else
      echo "Uploading ${#valid_files[@]} files in one message..."
      
      # Build media JSON array
      media_json='['
      first=true
      
      for file in "${valid_files[@]}"; do
        filename=$(basename "$file")
        if [ "$first" = true ]; then
          # First file gets the caption - properly escape the caption
          escaped_caption=$(echo "${{ inputs.caption }}" | sed 's/"/\\"/g' | sed 's/\\n/\\\\n/g')
          media_json+="{\"type\": \"document\", \"media\": \"attach://$filename\", \"caption\": \"$escaped_caption\", \"parse_mode\": \"HTML\"}"
          first=false
        else
          media_json+=",{\"type\": \"document\", \"media\": \"attach://$filename\"}"
        fi
      done
      
      media_json+=']'
      
      echo "Media JSON: $media_json"
      
      # Build form data for curl
      form_data=()
      form_data+=("chat_id=${{ inputs.chat_id }}")
      form_data+=("message_thread_id=${{ inputs.chat_thread_id }}")
      form_data+=("media=$media_json")
      
      # Add each file as attachment
      for file in "${valid_files[@]}"; do
        filename=$(basename "$file")
        form_data+=("$filename=@$file")
      done
      
      # Execute the curl command
      curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendMediaGroup" \
        -F "chat_id=${{ inputs.chat_id }}" \
        -F "message_thread_id=${{ inputs.chat_thread_id }}" \
        -F "media=$media_json" \
        $(for file in "${valid_files[@]}"; do echo "-F $(basename "$file")=@$file"; done)
      
      # Check the exit code
      curl_exit_code=$?
      if [ $curl_exit_code -eq 0 ]; then
        echo "Files uploaded successfully as media group!"
      else
        echo "Error uploading files. Curl exit code: $curl_exit_code"
        echo "Trying fallback method: sending files individually..."
        
        # Fallback: send files individually
        for file in "${valid_files[@]}"; do
          if [ "$file" = "${valid_files[0]}" ]; then
            # First file with caption
            curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument" \
              -F "chat_id=${{ inputs.chat_id }}" \
              -F "message_thread_id=${{ inputs.chat_thread_id }}" \
              -F "document=@$file" \
              -F "caption=${{ inputs.caption }}" \
              -F "parse_mode=HTML"
          else
            # Subsequent files without caption
            curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot_token }}/sendDocument" \
              -F "chat_id=${{ inputs.chat_id }}" \
              -F "message_thread_id=${{ inputs.chat_thread_id }}" \
              -F "document=@$file"
          fi
          sleep 1 # Avoid rate limiting
        done
      fi
    fi
    
    echo "Telegram upload process completed."
  shell: bash